plugins {
    id 'com.android.application'
}

android {
    namespace 'com.kinar.rmdproject'
    compileSdk 33

    defaultConfig {
        applicationId "com.kinar.rmdproject"
        minSdk 21
        targetSdk 33
        versionCode 1
        versionName "1.0"
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
}
